<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>波長API マルチインデックス解析 — IndexDB キャッシュ</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.0.7/dist/geotiff.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@300;400;600&display=swap');
:root {
  --bg:#ffffff; --panel:#f8fafc; --card:#ffffff; --border:#cbd5e1;
  --accent:#059669; --blue:#3b82f6; --green:#16a34a; --red:#ef4444;
  --text:#0f172a; --muted:#64748b;
  --mono:'Space Mono',monospace; --sans:'Noto Sans JP',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:400;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

header{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;z-index:1000;}
.sat{font-size:1.3rem;}
header h1{font-family:var(--mono);font-size:0.85rem;letter-spacing:.02em;font-weight:700;}
header h1 em{color:var(--accent);font-style:normal;}

.app-body{display:flex;flex:1;overflow:hidden;}
.side{width:320px;min-width:280px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
.side-scroll{flex:1;overflow-y:auto;padding:12px 12px 20px;scrollbar-width:thin;}

.sh{font-family:var(--mono);font-size:0.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:14px 0 8px;display:flex;align-items:center;gap:8px;font-weight:700;}
.sh:first-child{margin-top:0;}
.sh::after{content:'';flex:1;height:1px;background:var(--border);}

.cfg{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:7px;padding:10px 11px;margin-bottom:8px;}
.cfg label{display:block;font-family:var(--mono);font-size:0.56rem;font-weight:700;color:#047857;text-transform:uppercase;margin-bottom:3px;margin-top:8px;}
.cfg label:first-of-type{margin-top:0;}
.cfg input{width:100%;background:#fff;border:1px solid #bbf7d0;border-radius:5px;color:var(--text);padding:6px 8px;font-size:0.75rem;font-family:var(--mono);outline:none;}
.cfg input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(5,150,105,0.15);}

.btn-run{width:100%;background:var(--accent);color:#fff;border:none;border-radius:7px;padding:10px;font-size:0.78rem;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;letter-spacing:.02em;}
.btn-run:hover:not(:disabled){background:#047857;transform:translateY(-1px);box-shadow:0 4px 12px rgba(5,150,105,0.25);}
.btn-run:disabled{background:#94a3b8;cursor:not-allowed;}

.layer-panel{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:10px;margin-bottom:8px;}
.layer-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:5px;background:var(--panel);margin-bottom:5px;cursor:pointer;transition:all .15s;}
.layer-item:hover{background:#f1f5f9;border-color:var(--accent);}
.layer-item input[type=checkbox]{cursor:pointer;accent-color:var(--accent);}
.layer-name{flex:1;font-size:0.73rem;font-weight:600;color:var(--text);}
.layer-opacity{width:50px;}
.layer-opacity input{width:100%;height:4px;accent-color:var(--accent);}
.layer-opacity-val{font-size:0.6rem;color:var(--muted);font-family:var(--mono);min-width:30px;text-align:right;}

.status{border-radius:6px;padding:8px 10px;font-size:0.66rem;display:flex;align-items:center;gap:8px;margin-top:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:var(--mono);line-height:1.4;}
.status.loading{border-color:var(--blue);color:var(--blue);background:rgba(59,130,246,0.05);}
.status.ok{border-color:var(--green);color:var(--green);background:rgba(22,163,74,0.05);}
.status.error{border-color:var(--red);color:#b91c1c;background:rgba(239,68,68,0.06);}
@keyframes spin{to{transform:rotate(360deg);}}
.spinner{width:8px;height:8px;border:2px solid transparent;border-top-color:currentColor;border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0;}

.stats-box{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px;margin-top:8px;font-size:0.65rem;}
.stat-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border);}
.stat-row:last-child{border-bottom:none;}
.stat-label{color:var(--muted);}
.stat-value{font-family:var(--mono);font-weight:700;color:var(--accent);}

.map-area{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
#map{flex:1;}
.map-toolbar{position:absolute;top:12px;right:12px;z-index:900;display:flex;flex-direction:column;gap:6px;}
.tbtn{background:rgba(255,255,255,0.95);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:0.65rem;padding:6px 11px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.08);transition:all .2s;white-space:nowrap;font-weight:600;}
.tbtn:hover{border-color:var(--accent);color:var(--accent);}
.tbtn:disabled{opacity:.5;cursor:not-allowed;}

.map-info-bar{background:var(--panel);border-top:1px solid var(--border);padding:6px 14px;font-size:0.62rem;color:var(--muted);display:flex;gap:14px;align-items:center;}
.cl{color:var(--accent);font-family:var(--mono);font-weight:700;}
</style>
</head>
<body>

<header>
  <span class="sat">📡</span>
  <h1>API波長 → マルチインデックス <em>[IndexDB Cache]</em></h1>
</header>

<div class="app-body">
  <div class="side">
    <div class="side-scroll">
      
      <!-- API設定 -->
      <div class="sh">⚙️ API設定</div>
      <div class="cfg">
        <label>API URL（TIFF）</label>
        <input type="text" id="apiUrl" placeholder="https://sentinel-cogs.s3.us-west-2.amazonaws.com/sentinel-s2-l2a-cogs/{tile}/{year}/{month}/{day}/0/B{band}.jp2" value="https://sentinel-cogs.s3.us-west-2.amazonaws.com/sentinel-s2-l2a-cogs/54/S/UD/2023/7/3/0/B{band}.jp2">
        <label style="margin-top:10px;">バンド指定（カンマ区切り）</label>
        <input type="text" id="bandList" placeholder="B02,B03,B04,B08,B11" value="B02,B03,B04,B08,B11">
        <label style="margin-top:10px;">キャッシュキー</label>
        <input type="text" id="cacheKey" placeholder="scene_20240615" value="S2_54SUD_20230703">
      </div>
      <button class="btn-run" onclick="fetchBandsFromAPI()">
        <span class="spinner" id="load-spinner" style="display:none;"></span>
        API取得 & キャッシュ
      </button>
      <div class="status" id="status">準備完了</div>

      <!-- インデックス計算パネル -->
      <div class="sh">📊 計算指標</div>
      <div class="layer-panel">
        <div class="layer-item" onclick="toggleIndex('ndvi')">
          <input type="checkbox" id="chk-ndvi" checked>
          <span class="layer-name">NDVI</span>
        </div>
        <div class="layer-item" onclick="toggleIndex('evi')">
          <input type="checkbox" id="chk-evi" checked>
          <span class="layer-name">EVI</span>
        </div>
        <div class="layer-item" onclick="toggleIndex('savi')">
          <input type="checkbox" id="chk-savi">
          <span class="layer-name">SAVI</span>
        </div>
        <div class="layer-item" onclick="toggleIndex('msavi')">
          <input type="checkbox" id="chk-msavi">
          <span class="layer-name">MSAVI2</span>
        </div>
        <div class="layer-item" onclick="toggleIndex('gndvi')">
          <input type="checkbox" id="chk-gndvi">
          <span class="layer-name">GNDVI</span>
        </div>
        <div class="layer-item" onclick="toggleIndex('rvi')">
          <input type="checkbox" id="chk-rvi">
          <span class="layer-name">RVI</span>
        </div>
      </div>
      <button class="btn-run" onclick="calculateAndRenderLayers()" style="background:#3b82f6;">
        計算 & レンダリング
      </button>

      <!-- レイヤーコントロール -->
      <div class="sh">🎨 レイヤー表示</div>
      <div id="layer-controls"></div>

      <!-- 統計 -->
      <div class="sh">📈 統計</div>
      <div class="stats-box" id="stats-display">
        <div class="stat-row">
          <span class="stat-label">キャッシュ状態</span>
          <span class="stat-value" id="cache-status">未読込</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">バンド数</span>
          <span class="stat-value" id="band-count">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">メモリ使用量</span>
          <span class="stat-value" id="memory-size">0 MB</span>
        </div>
      </div>

    </div>
  </div>

  <div class="map-area">
    <div id="map"></div>
    <div class="map-toolbar">
      <button class="tbtn" onclick="clearAllLayers()">クリア</button>
      <button class="tbtn" onclick="exportLayerStack()">EXP</button>
    </div>
    <div class="map-info-bar">
      <span>座標: <span class="cl" id="mc">-</span></span>
    </div>
  </div>
</div>

<script>

// ━━━━━━━━━━━━━━━━━━━ IndexDB管理 ━━━━━━━━━━━━━━━━━━━
class BandCache {
  constructor() {
    this.dbName = 'WavelengthBandsDB';
    this.storeName = 'bands';
    this.db = null;
  }

  async init() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.dbName, 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(this.storeName)) {
          db.createObjectStore(this.storeName);
        }
      };
      req.onsuccess = () => { this.db = req.result; resolve(); };
      req.onerror = () => reject(req.error);
    });
  }

  async set(key, data) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(this.storeName, 'readwrite');
      const store = tx.objectStore(this.storeName);
      const req = store.put({ data, timestamp: Date.now() }, key);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  async get(key) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(this.storeName, 'readonly');
      const store = tx.objectStore(this.storeName);
      const req = store.get(key);
      req.onsuccess = () => resolve(req.result?.data || null);
      req.onerror = () => reject(req.error);
    });
  }

  async getAll() {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(this.storeName, 'readonly');
      const store = tx.objectStore(this.storeName);
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async clear() {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(this.storeName, 'readwrite');
      const req = tx.objectStore(this.storeName).clear();
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }
}

const bandCache = new BandCache();
let bandData = {}; // {B02: Float32Array, B03: ..., ...}
let indexLayers = {}; // {ndvi: ImageData, evi: ..., ...}
let layerObjects = {}; // Leafletレイヤーオブジェクト
let activeIndices = new Set(['ndvi', 'evi']);

// ━━━━━━━━━━━━━━━━━━━ API取得 & キャッシング ━━━━━━━━━━━━━━━━━━━
async function fetchBandsFromAPI() {
  setStatus('API取得開始...', 'loading');
  const apiUrl = document.getElementById('apiUrl').value.trim();
  const bandList = document.getElementById('bandList').value.split(',').map(b => b.trim());
  const cacheKey = document.getElementById('cacheKey').value.trim() || 'default';

  if (!apiUrl) { setStatus('APIのURLを入力してください', 'error'); return; }

  try {
    await bandCache.init();

    // キャッシュ確認
    let cached = await bandCache.get(cacheKey);
    if (cached) {
      bandData = cached;
      setStatus(`キャッシュから読込: ${Object.keys(bandData).length}バンド`, 'ok');
      updateCacheDisplay();
      return;
    }

    // API取得
    for (const band of bandList) {
      try {
        const url = apiUrl.replace('{BAND}', band).replace('{band}', band);
        setStatus(`取得中: ${band}...`, 'loading');
        
        console.log(`Fetching: ${url}`);
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status} - ${url}`);
        
        const buf = await resp.arrayBuffer();
        const tiff = await GeoTIFF.fromArrayBuffer(buf);
        const img = await tiff.getImage();
        const arr = await img.readRasters();
        
        bandData[band] = new Float32Array(arr[0]);
      } catch (e) {
        setStatus(`${band}取得失敗: ${e.message}`, 'error');
      }
    }

    if (Object.keys(bandData).length > 0) {
      await bandCache.set(cacheKey, bandData);
      setStatus(`${Object.keys(bandData).length}バンド取得 & キャッシュ保存`, 'ok');
      updateCacheDisplay();
    } else {
      setStatus('バンドデータが取得できませんでした', 'error');
    }
  } catch (e) {
    setStatus(`エラー: ${e.message}`, 'error');
  }
}

function updateCacheDisplay() {
  document.getElementById('cache-status').textContent = Object.keys(bandData).length > 0 ? '✓ 読込済' : '未読込';
  document.getElementById('band-count').textContent = Object.keys(bandData).length;
  
  let memSize = 0;
  for (const arr of Object.values(bandData)) {
    memSize += arr.byteLength;
  }
  document.getElementById('memory-size').textContent = (memSize / 1024 / 1024).toFixed(2) + ' MB';
}

// ━━━━━━━━━━━━━━━━━━━ インデックス計算 ━━━━━━━━━━━━━━━━━━━
function getFloat32Array(band) {
  return bandData[band] || new Float32Array(0);
}

function computeIndex(indexName) {
  const B02 = getFloat32Array('B02');
  const B03 = getFloat32Array('B03');
  const B04 = getFloat32Array('B04');
  const B08 = getFloat32Array('B08');
  const B11 = getFloat32Array('B11');
  const B12 = getFloat32Array('B12');

  if (B08.length === 0) { setStatus('B08 (NIR) が必要です', 'error'); return null; }

  const len = B08.length;
  const result = new Float32Array(len);
  const RED = B04.length > 0 ? B04 : new Float32Array(len);
  const GREEN = B03.length > 0 ? B03 : new Float32Array(len);
  const SWIR = B11.length > 0 ? B11 : new Float32Array(len);

  if (indexName === 'ndvi') {
    for (let i = 0; i < len; i++) {
      const nir = B08[i], red = RED[i];
      result[i] = (nir - red) / (nir + red + 1e-8);
    }
  } else if (indexName === 'evi') {
    const G = 2.5, C1 = 6, C2 = 7.5, L = 1;
    for (let i = 0; i < len; i++) {
      const nir = B08[i], red = RED[i], blue = B02[i] || 0;
      const num = nir - red;
      const denom = nir + C1 * red - C2 * blue + L;
      result[i] = G * (num / (denom + 1e-8));
    }
  } else if (indexName === 'savi') {
    const L = 0.5;
    for (let i = 0; i < len; i++) {
      const nir = B08[i], red = RED[i];
      result[i] = ((nir - red) / (nir + red + L) * (1 + L));
    }
  } else if (indexName === 'msavi') {
    for (let i = 0; i < len; i++) {
      const nir = B08[i], red = RED[i];
      const ndvi = (nir - red) / (nir + red + 1e-8);
      result[i] = ndvi * (1 - 2 * ndvi * ndvi);
    }
  } else if (indexName === 'gndvi') {
    for (let i = 0; i < len; i++) {
      const nir = B08[i], green = GREEN[i];
      result[i] = (nir - green) / (nir + green + 1e-8);
    }
  } else if (indexName === 'rvi') {
    for (let i = 0; i < len; i++) {
      const nir = B08[i], red = RED[i];
      result[i] = nir / (red + 1e-8);
    }
  }

  return result;
}

function computeAndRenderLayers() {
  if (Object.keys(bandData).length === 0) {
    setStatus('先にAPIでバンドを取得してください', 'error');
    return;
  }

  setStatus('計算中...', 'loading');

  try {
    for (const idx of activeIndices) {
      const arr = computeIndex(idx);
      if (!arr) continue;

      indexLayers[idx] = floatToImageData(arr);
    }

    renderLayersOnMap();
    renderLayerControls();
    setStatus(`${activeIndices.size}個のレイヤーをレンダリング`, 'ok');
  } catch (e) {
    setStatus(`レンダリング失敗: ${e.message}`, 'error');
  }
}

function floatToImageData(floatArray) {
  const len = floatArray.length;
  const sqrt = Math.sqrt(len);
  const w = Math.floor(sqrt);
  const h = Math.ceil(len / w);

  const imgData = new ImageData(w, h);
  const data = imgData.data;

  for (let i = 0; i < len; i++) {
    const val = Math.max(-1, Math.min(1, floatArray[i]));
    const c = Math.floor((val + 1) / 2 * 255);
    data[i * 4] = c; data[i * 4 + 1] = c; data[i * 4 + 2] = c; data[i * 4 + 3] = 255;
  }

  return imgData;
}

function renderLayersOnMap() {
  // 既存レイヤーをクリア
  for (const layer of Object.values(layerObjects)) {
    map.removeLayer(layer);
  }
  layerObjects = {};

  const bounds = map.getBounds();

  for (const [idx, imgData] of Object.entries(indexLayers)) {
    if (!activeIndices.has(idx)) continue;

    const canvas = document.createElement('canvas');
    canvas.width = imgData.width;
    canvas.height = imgData.height;
    const ctx = canvas.getContext('2d');
    ctx.putImageData(imgData, 0, 0);

    const overlay = L.imageOverlay(canvas.toDataURL(), bounds, {
      opacity: 0.7,
      className: `index-${idx}`
    }).addTo(map);

    layerObjects[idx] = overlay;
  }
}

function renderLayerControls() {
  const ctrl = document.getElementById('layer-controls');
  ctrl.innerHTML = '';

  for (const idx of Array.from(activeIndices).sort()) {
    const div = document.createElement('div');
    div.className = 'layer-item';
    div.innerHTML = `
      <input type="checkbox" id="vis-${idx}" checked onchange="toggleLayerVisibility('${idx}')">
      <span class="layer-name">${idx.toUpperCase()}</span>
      <div class="layer-opacity">
        <input type="range" min="0" max="100" value="70" onchange="setLayerOpacity('${idx}', this.value)">
        <span class="layer-opacity-val"><span id="op-${idx}">70</span>%</span>
      </div>
    `;
    ctrl.appendChild(div);
  }
}

function toggleIndex(idx) {
  const chk = document.getElementById(`chk-${idx}`);
  if (chk.checked) {
    activeIndices.add(idx);
  } else {
    activeIndices.delete(idx);
  }
}

function toggleLayerVisibility(idx) {
  if (layerObjects[idx]) {
    const chk = document.getElementById(`vis-${idx}`);
    if (chk.checked) {
      map.addLayer(layerObjects[idx]);
    } else {
      map.removeLayer(layerObjects[idx]);
    }
  }
}

function setLayerOpacity(idx, val) {
  document.getElementById(`op-${idx}`).textContent = val;
  if (layerObjects[idx]) {
    layerObjects[idx].setOpacity(val / 100);
  }
}

function clearAllLayers() {
  for (const layer of Object.values(layerObjects)) {
    map.removeLayer(layer);
  }
  layerObjects = {};
  indexLayers = {};
  document.getElementById('layer-controls').innerHTML = '';
  setStatus('レイヤークリア', 'ok');
}

function exportLayerStack() {
  if (Object.keys(indexLayers).length === 0) {
    setStatus('エクスポートするレイヤーがありません', 'error');
    return;
  }

  const data = {
    timestamp: new Date().toISOString(),
    bounds: map.getBounds(),
    indices: Array.from(activeIndices),
    bandInfo: Object.keys(bandData)
  };

  console.log('レイヤースタック:', data);
  setStatus('コンソールにエクスポート', 'ok');
}

// ━━━━━━━━━━━━━━━━━━━ UI & マップ ━━━━━━━━━━━━━━━━━━━
const gsiPale = L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", 
  { maxNativeZoom: 18, maxZoom: 22, attribution: "地理院淡色" });
const cartoLight = L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", 
  { maxNativeZoom: 19, maxZoom: 22, attribution: "©CARTO" });

const map = L.map('map', {
  center: [37.63, 132.76], // 出雲
  zoom: 11,
  layers: [gsiPale],
  renderer: L.svg()
});

L.control.layers(
  { "地理院淡色": gsiPale, "白地図": cartoLight },
  null,
  { position: 'bottomleft' }
).addTo(map);

map.on('mousemove', e => {
  document.getElementById('mc').textContent = `${e.latlng.lat.toFixed(4)}°, ${e.latlng.lng.toFixed(4)}°`;
});

function setStatus(msg, type='') {
  const el = document.getElementById('status');
  el.className = 'status ' + type;
  el.innerHTML = type === 'loading' ? `<div class="spinner"></div>${msg}` : msg;
}

// 初期化
bandCache.init().then(() => {
  setStatus('IndexDB初期化完了', 'ok');
});

</script>
</body>
</html>
